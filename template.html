<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de apuestas</title><style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#14181f;--mu:#5d6675;--bd:#e2e5ea;--ac:#0b7a5a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--cd:#171c23;--tx:#e8ebf0;--mu:#96a0b0;--bd:#2a313b;--ac:#35c58f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}main{max-width:940px;margin:auto;padding:16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:9px 0}.m{color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.c{border:1px solid var(--bd);border-radius:8px;padding:5px;text-align:center;font-size:12px;color:var(--mu)}
.c b{display:block;font-size:15px;color:var(--tx)}.v{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.bar button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 13px;border-radius:20px;cursor:pointer;margin:0 6px 6px 0}.bar .on{background:var(--ac);color:#fff}
.t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.big{font-size:20px;font-weight:700}ul{padding-left:18px;margin:6px 0 0}
</style></head><body><main><h1>Radar de apuestas</h1><div class="m" id="up"></div>
<div class="card m">Probabilidades de un modelo Poisson propio ajustado con resultados reales; cuotas = mejor precio entre casas (The Odds API). “Valor” = prob × cuota − 1. Son estimaciones, no certezas. Juego responsable.</div>
<div class="bar" id="tabs"><button class="on" data-t="f">Fútbol</button><button data-t="c">Combinadas</button><button data-t="t">Tenis</button></div>
<section id="f"></section><section id="c" hidden></section><section id="t" hidden></section></main>
<script>
const D=__DATA__,MG=D.margin,$=s=>document.querySelector(s),pc=x=>(x*100).toFixed(0)+"%";
$("#up").textContent="Actualizado: "+D.updated;
const L=[["p1","1"],["px","X"],["p2","2"]];
function cell(lbl,p,o){const e=o?p*o.o-1:null;return `<div class="c ${e>0.03?"v":""}">${lbl}<b>${pc(p)}</b>${o?`@${o.o.toFixed(2)} <small>${o.bk}</small><br>valor ${(e*100).toFixed(0)}%`:`mín. ${(MG/p).toFixed(2)}`}</div>`}
$("#f").innerHTML=D.football.map(m=>{const d=new Date(m.d);return `<div class="card"><div class="t"><b>${m.h} – ${m.a}</b><span class="m">${d.toLocaleString("es-ES",{weekday:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})} · ${m.c}</span></div>
<div class="g">${L.map(([k,l])=>cell(l,m.p[k],m.odds[k])).join("")}${cell("+2.5",m.p.o25,m.odds.o25)}${cell("Ambos marcan",m.p.btts,null)}</div>
<div class="m" style="margin-top:6px">xG ${m.xg[0]}–${m.xg[1]}${m.flags[0]||m.flags[1]?" · ⚠ noticias de bajas ("+m.flags+")":""}${m.news.length?"<br>"+m.news.join("<br>"):""}</div></div>`}).join("")||"<div class='card'>Sin partidos (revisa las claves).</div>";
function legs(m){const p=m.p,o=m.odds,H=m.h,A=m.a;return[[p.p1,"Gana "+H,o.p1],[p.p2,"Gana "+A,o.p2],[p.p1+p.px,H+" o empate",null],[p.px+p.p2,A+" o empate",null],[p.o15,"Más de 1.5 goles",null],[p.o25,"Más de 2.5 goles",o.o25],[1-p.o25,"Menos de 2.5 goles",o.u25],[p.btts,"Ambos marcan",null]]}
const T=[["1 · Segura",.8,1,3],["2 · Sólida",.68,.8,3],["3 · Media",.55,.68,4],["4 · Atrevida",.42,.55,4],["5 · Loca",.3,.42,5]];
$("#c").innerHTML=T.map(([n,lo,hi,k])=>{const c=[];D.football.forEach(m=>{const ok=legs(m).filter(l=>l[0]>=lo&&l[0]<hi).sort((a,b)=>b[0]-a[0]);if(ok.length)c.push([m,ok[0]])});
c.sort((a,b)=>b[1][0]-a[1][0]);const s=c.slice(0,k);if(s.length<2)return `<div class="card"><b>${n}</b><div class="m">Sin suficientes selecciones en este rango.</div></div>`;
let pr=1,od=1,est=false;const li=s.map(([m,l])=>{pr*=l[0];const o=l[2]?l[2].o:(est=true,MG/l[0]);od*=o;return `<li>${m.h} – ${m.a}: <b>${l[1]}</b> · ${pc(l[0])} · @${o.toFixed(2)}${l[2]?"":"*"}</li>`}).join("");
return `<div class="card"><div class="t"><b>${n}</b><span><span class="big">${pr>=.1?pc(pr):(pr*100).toFixed(1)+"%"}</span> · cuota ${od.toFixed(2)}${est?"*":""}</span></div><ul>${li}</ul></div>`}).join("")+"<div class='m'>* cuota estimada (sin precio real disponible). Probabilidad suponiendo partidos independientes.</div>";
$("#t").innerHTML=D.tennis.map(t=>{const fav=t.pa>=.5,p=fav?t.pa:1-t.pa,n=fav?t.a:t.b,o=fav?t.oa:t.ob;return `<div class="card"><div class="t"><b>${t.a} – ${t.b}</b><span class="m">${t.t}</span></div>
<div class="m">Favorito: <b>${n}</b> · ${pc(p)}${o?" · cuota "+o.toFixed(2)+" · valor "+((p*o-1)*100).toFixed(0)+"%":""} · ${p>=.72?"✅ candidato seguro":"partido abierto"} · fuente: ${t.src}${t.note?" · "+t.note:""}</div></div>`}).join("")||"<div class='card'>Sin partidos de tenis. Añade filas a tennis_manual.csv para Challengers.</div>";
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));["f","c","t"].forEach(i=>$("#"+i).hidden=i!==b.dataset.t)});
</script></body></html>
